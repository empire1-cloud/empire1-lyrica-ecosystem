# Triggered through a normal merged PR so GitHub runs the workflow.
name: Capture Omni-Agent product screenshots

on:
  push:
    paths:
      - .github/workflows/capture-product-screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright browser
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Serve built SPA
        run: |
          npx --yes serve@14 -s frontend/build -l 4173 > /tmp/omni-serve.log 2>&1 &
          echo $! > /tmp/omni-serve.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/omni-serve.log
          exit 1

      - name: Capture clean screenshots
        run: |
          mkdir -p docs/screenshots
          npx --yes playwright@1.55.0 screenshot --browser chromium --full-page --viewport-size='1440,900' http://127.0.0.1:4173/ docs/screenshots/landing-page.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size='1440,900' http://127.0.0.1:4173/#pricing docs/screenshots/pricing.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size='1440,900' http://127.0.0.1:4173/github/installed docs/screenshots/github-installed.png

      - name: Commit screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo 'Screenshots already current.'
          else
            git commit -m 'docs: capture Omni-Agent product screenshots'
            git push
          fi
